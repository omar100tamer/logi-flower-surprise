<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوجي ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#53204c,#170b2d 60%,#080815);overflow-x:hidden} .petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.petal{position:absolute;top:-10vh;animation:fall linear infinite;opacity:.75;font-size:clamp(18px,3vw,32px)}@keyframes fall{to{transform:translateY(120vh) rotate(360deg)}}main{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(680px,100%);text-align:center;padding:clamp(22px,5vw,44px);border:1px solid #ffffff30;border-radius:28px;background:#ffffff10;backdrop-filter:blur(12px);box-shadow:0 20px 70px #0005}h1{font-size:clamp(30px,7vw,54px);margin:0 0 12px;color:#ffd8e9}p{font-size:clamp(16px,3.5vw,20px);line-height:1.9;color:#ffeaf3}.flowers{font-size:clamp(28px,7vw,54px);line-height:1.7;margin:18px 0;filter:drop-shadow(0 5px 12px #ff5ca855)}input{width:min(260px,100%);padding:14px 16px;border-radius:14px;border:1px solid #ffffff55;background:#ffffff16;color:#fff;text-align:center;font-size:20px;outline:none}input::placeholder{color:#eacddd}button{border:0;border-radius:14px;padding:14px 24px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#ff80b5,#ffcfdf);color:#48102e;cursor:pointer;margin:12px 6px;box-shadow:0 8px 25px #ff6da344}button:active{transform:scale(.98)}#error{color:#ffd1df;min-height:26px}.hidden{display:none}.bouquet{font-size:clamp(54px,12vw,100px);line-height:1.4;animation:pop .8s ease both; margin-top:12px}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}.apology{font-size:clamp(26px,6vw,42px);font-weight:bold;color:#ffd3e5;text-shadow:0 0 24px #ff65a9;margin:10px 0 0}.small{font-size:14px;color:#e5c8db}
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<main><section class="card">
<div class="flowers" aria-label="ورود وزهور">🌷 🌹 🌸 💐 🌼 🌺 🌷</div>
<h1>مفاجأة صغيرة ليكي يا لوجي 💗</h1>
<p>في حاجة حلوة مستنياكي… اكتبي الرقم السري وافتحي المفاجأة 🌷</p>
<form id="unlockForm"><input id="password" type="password" inputmode="numeric" placeholder="الرقم السري" aria-label="الرقم السري" autocomplete="off"><br><button type="submit">افتحي المفاجأة 💝</button></form>
<div id="error" role="status"></div>
<div id="surprise" class="hidden">
<div class="bouquet">💐🌹🌷🌸🌺💖🌼🌹💐</div>
<div class="apology">أنا اسف يا لوجي ❤️</div>
<p>أتمنى الورد ده يرسم ابتسامة على وشك، وتقبلي اعتذاري من قلبي 🌷</p>
<div class="flowers">🌹 🌸 🌷 💖 🌷 🌸 🌹</div>
</div>
<p class="small">مع خالص الاعتذار والمحبة ❤️</p>
</section></main>
<script>
const petals=document.getElementById('petals');
const symbols=['🌸','🌷','🌹','💮','🌼','💗'];
for(let i=0;i<28;i++){const s=document.createElement('span');s.className='petal';s.textContent=symbols[i%symbols.length];s.style.left=(Math.random()*100)+'%';s.style.animationDuration=(9+Math.random()*13)+'s';s.style.animationDelay=(-Math.random()*20)+'s';s.style.fontSize=(18+Math.random()*18)+'px';petals.appendChild(s)}
document.getElementById('unlockForm').addEventListener('submit',function(e){e.preventDefault();const p=document.getElementById('password').value;if(p==='1111'){document.getElementById('surprise').classList.remove('hidden');document.getElementById('error').textContent='';document.getElementById('unlockForm').classList.add('hidden');document.querySelector('main .card > p').classList.add('hidden');}else{document.getElementById('error').textContent='الرقم مش صح، جربي تاني 💗';}});
</script>
</body>
</html>
